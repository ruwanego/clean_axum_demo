name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compile-time query checks use the committed .sqlx metadata
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (opentelemetry feature)
        run: cargo clippy --all-targets --features opentelemetry -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://testuser:pass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Apply migrations to a fresh database
        run: cargo run --locked -- migrate
        env:
          JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-000000
          SERVICE_PORT: "8080"
          ASSETS_PUBLIC_PATH: assets/public
          ASSETS_PUBLIC_URL: /assets/public
          ASSETS_PRIVATE_PATH: assets/private
          ASSETS_PRIVATE_URL: /assets/private
          ASSET_ALLOWED_EXTENSIONS: jpg|jpeg|png
      - name: Load seed data
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db-seed/02-seed.sql
      - name: Check .sqlx offline metadata is up to date
        run: cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: "false"
      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
