[package]
license = "MIT"
name = "clean_axum_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
axum = { version = "0.8.3", features = ["multipart"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tower = { version = "0.5.2", features = ["timeout"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.1", features = ["axum"] }
async-trait = "0.1.88"
regex = "1.11.1"
tokio-util = "0.7.14"
http-body-util = "0.1.3"
validator = { version = "0.21", features = ["derive"] }
argon2 = "0.6"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
chrono = "0.4.40"
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "json",
    "registry",
    "std",
    "fmt",
    "chrono",
] }

# Optional OpenTelemetry-related crates (all `optional = true`)
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["http-json", "http-proto"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
simple_dto_mapper_derive = "0.1.1"

[features]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
